services:
  postgres:
    image: postgres:17
    container_name: morae-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: morae
      POSTGRES_PASSWORD: morae
      POSTGRES_DB: morae
    ports:
      - '5432:5432'
    volumes:
      - morae_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U morae -d morae']
      interval: 5s
      timeout: 5s
      retries: 10

  # Servidor SMTP de desenvolvimento: recebe os e-mails sem entregá-los e os
  # mostra em http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.33
    container_name: morae-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # interface web e API

volumes:
  morae_pgdata:
